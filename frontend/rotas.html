<div class="container mt-4">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">
🚌 Rotas do Transporte
</h2>

<input
id="busca"
class="form-control mb-3"
placeholder="Buscar rota..."
onkeyup="filtrarRotas()">

<div class="alert alert-info">

Total de rotas:
<strong id="totalRotas">
0
</strong>

</div>

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Nome</th>

<th>Horário</th>

<th>Capacidade</th>

<th>Lotação</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const usuario =
JSON.parse(
localStorage.getItem('usuario')
);

if(usuario){

document.getElementById('usuario').innerHTML =
`Olá ${usuario.nome} 👋`;

}

if(usuario && usuario.tipo === 'ADMIN'){

document.getElementById(
'menuAdmin'
).style.display = 'block';

}

fetch(
'/rotas'
)
.then(r => r.json())
.then(dados => {

let html = '';

document.getElementById(
'totalRotas'
).innerHTML =
dados.length;

dados.forEach(r => {

const porcentagem =
(r.lotacao / r.capacidade) * 100;

html += `

<tr>

<td>
${r.id}
</td>

<td>
${r.nome}
</td>

<td>
${r.horario}
</td>

<td>
${r.capacidade}
</td>

<td>

<div class="progress">

<div
class="progress-bar"
role="progressbar"
style="width:${porcentagem}%">

${r.lotacao}/${r.capacidade}

</div>

</div>

</td>

</tr>

`;

});

document.getElementById(
'tabela'
).innerHTML = html;

});

function filtrarRotas(){

const texto =
document.getElementById('busca')
.value
.toLowerCase();

const linhas =
document.querySelectorAll(
'#tabela tr'
);

linhas.forEach(linha => {

if(

linha.innerText
.toLowerCase()
.includes(texto)

){

linha.style.display = '';

}else{

linha.style.display = 'none';

}

});

}

function sair(){

localStorage.removeItem(
'usuario'
);

window.location.href =
'index.html';

}

</script>
