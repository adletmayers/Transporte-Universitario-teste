<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="img/Gemini_Generated_Image_69ohf669ohf669oh_1_.ico">
<title>Perfil</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="navbar-container"></div>

<div class="container mt-4">

<div class="card shadow p-4">

<div class="text-center">

<img
src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
width="120"
class="rounded-circle border mb-3">

<h2>
Meu Perfil
</h2>
<div class="mt-3">

    <span
    id="badgeTipo"
    class="badge fs-6">
    </span>

</div>

<hr>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">

            Tema do Sistema

        </label>

        <select
        id="temaSelect"
        class="form-select"
        onchange="alterarTema()">

            <option value="dark">

                🌙 Dark

            </option>

            <option value="light">

                ☀️ Light

            </option>

        </select>

    </div>

</div>
</div>

<hr>

<div id="perfil"></div>

<div class="text-center mt-4">

<button
class="btn btn-primary me-2"
onclick="editarPerfil()">

✏️ Editar Perfil

</button>

<button
class="btn btn-warning"
onclick="alterarSenha()">

🔒 Alterar Senha

</button>

</div>

</div>

</div>

<script>


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div
class="modal fade"
id="modalPerfil">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Editar Perfil</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<input
id="editNome"
class="form-control mb-2"
placeholder="Nome">

<input
id="editEmail"
class="form-control mb-2"
placeholder="Email">

<input
id="editCpf"
class="form-control mb-2"
placeholder="CPF">

<input
id="editNascimento"
type="date"
class="form-control">
<input
id="editMatricula"
class="form-control mb-2"
placeholder="Matrícula">

<input
id="editUniversidade"
class="form-control mb-2"
placeholder="Universidade">

<input
id="editCurso"
class="form-control mb-2"
placeholder="Curso">

<input
id="editTurno"
class="form-control mb-2"
placeholder="Turno">

<label class="form-label">
Validade da Carteirinha
</label>

<input
id="editValidade"
type="date"
class="form-control">
</div>

<div class="modal-footer">

<button
class="btn btn-success"
onclick="salvarPerfil()">

Salvar

</button>

</div>

</div>

</div>

</div>
<div class="modal fade" id="modalSenha">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Alterar Senha</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<input
type="password"
id="senhaAtual"
class="form-control mb-2"
placeholder="Senha atual">

<input
type="password"
id="novaSenha"
class="form-control mb-2"
placeholder="Nova senha">

<input
type="password"
id="confirmarSenha"
class="form-control"
placeholder="Confirmar nova senha">

</div>

<div class="modal-footer">

<button
class="btn btn-success"
onclick="salvarSenha()">

Salvar

</button>

</div>

</div>

</div>

</div>

</body>
<script src="js/perfil.js"></script>
<script src="js/tema.js"></script>
<script src="js/components.js"></script>
</html>
