<div class="container mt-4">

<h2>📊 Relatórios</h2>

<div class="row mt-4">

<div class="col-md-3">

<div class="card p-3 text-center">

<h5>Usuários</h5>

<h2 id="usuarios">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card p-3 text-center">

<h5>Viagens</h5>

<h2 id="viagens">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card p-3 text-center">

<h5>Compras</h5>

<h2 id="compras">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card p-3 text-center">

<h5>Faturamento</h5>

<h2 id="faturamento">
R$ 0
</h2>

</div>

</div>

</div>

</div>

<script>

const usuario =
JSON.parse(
localStorage.getItem('usuario')
);
if(usuario){

document.getElementById('usuario').innerHTML =
`Olá ${usuario.nome} 👋`;

}
if(usuario && usuario.tipo === 'ADMIN'){

    document.getElementById(
        'menuAdmin'
    ).style.display = 'block';

}

async function carregar(){

    const resposta =
    await fetch(
    'http://localhost:3000/admin/relatorios'
    );

    const dados =
    await resposta.json();

    document.getElementById('usuarios').innerHTML =
    dados.usuarios;

    document.getElementById('viagens').innerHTML =
    dados.viagens;

    document.getElementById('compras').innerHTML =
    dados.compras;

    document.getElementById('faturamento').innerHTML =
    `R$ ${dados.faturamento}`;

}

carregar();

</script>
