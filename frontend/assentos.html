Carregando informações...

</div>

Escolha seu Assento
</h4>

id="assentos"
class="d-flex flex-wrap mt-3">

</div>

</h5>

href="passagens.html"
class="btn btn-secondary">

← Escolher Outra Viagem

</a>

class="btn btn-success"
onclick="continuarPagamento()">

Continuar para Pagamento

</button>

<script>

const usuario =
JSON.parse(
localStorage.getItem('usuario')
);

if(!usuario){

    window.location.href =
    'index.html';

}

document.getElementById('usuario').innerHTML =
`Olá ${usuario.nome} 👋`;

if(usuario.tipo === 'ADMIN'){

    document.getElementById(
        'menuAdmin'
    ).style.display = 'block';

}

const viagemId =
localStorage.getItem(
'viagemSelecionada'
);

if(!viagemId){

    alert(
        'Nenhuma viagem selecionada'
    );

    window.location.href =
    'passagens.html';

}

let assentoSelecionado = null;

carregarViagem();
carregarAssentos();

// Atualiza os assentos a cada 10 segundos
setInterval(() => {
    carregarAssentos();
}, 10000);

async function carregarViagem(){

    try{

        const resposta =
        await fetch(
        'http://localhost:3000/passagens'
        );

        const viagens =
        await resposta.json();

        const viagem =
        viagens.find(
            v => v.id == viagemId
        );

        if(!viagem){

            document.getElementById(
                'viagemInfo'
            ).innerHTML =
            'Viagem não encontrada';

            return;

        }

        document.getElementById(
        'viagemInfo'
        ).innerHTML =

        `
        <p>
        <strong>Origem:</strong>
        ${viagem.origem}
        </p>

        <p>
        <strong>Destino:</strong>
        ${viagem.destino}
        </p>

        <p>
        <strong>Data:</strong>
        ${new Date(
        viagem.data_ida
        ).toLocaleDateString('pt-BR')}
        </p>

        <p>
        <strong>Saída:</strong>
        ${viagem.horario_saida.substring(0,5)}
        </p>

        <p>
        <strong>Vagas:</strong>
        ${viagem.vagas_disponiveis}
        </p>

        <h5 class="text-success">
        R$ ${viagem.valor}
        </h5>
        `;

    }catch(err){

        console.log(err);

    }

}

async function carregarAssentos(){

    try{

        const resposta =
        await fetch(
        `http://localhost:3000/assentos/viagem/${viagemId}`
        );

        const assentos =
        await resposta.json();

        let html = '';

        assentos.forEach(a => {

            html += `

            <button
                id="assento-${a.numero}"
                class="assento ${a.ocupado ? 'ocupado' : 'livre'}"
                ${a.ocupado ? 'disabled' : ''}
                onclick="selecionar(${a.numero})">

                ${a.numero}

            </button>

            `;

        });

        document.getElementById(
            'assentos'
        ).innerHTML = html;

        // Se o assento escolhido ficou ocupado
        if(assentoSelecionado){

            const atual =
            assentos.find(
                a => a.numero == assentoSelecionado
            );

            if(atual && atual.ocupado){

                assentoSelecionado = null;

                document.getElementById(
                    'assentoEscolhido'
                ).innerHTML =
                'Nenhum assento selecionado';

                alert(
                    'O assento escolhido acabou de ser ocupado por outro usuário.'
                );

            }

        }

    }catch(err){

        console.log(err);

        document.getElementById(
        'assentos'
        ).innerHTML =

        `
        <div class="alert alert-danger">
            Erro ao carregar assentos.
        </div>
        `;

    }

}
function selecionar(numero){

    document
    .querySelectorAll('.assento')
    .forEach(btn => {

        if(
        btn.classList.contains(
        'livre'
        )
        ){

            btn.classList.remove(
            'selecionado'
            );

        }

    });

    document
    .getElementById(
    `assento-${numero}`
    )
    .classList.add(
    'selecionado'
    );

    assentoSelecionado =
    numero;

    document.getElementById(
    'assentoEscolhido'
    ).innerHTML =

    `Assento selecionado: ${numero}`;

}

function continuarPagamento(){

    if(!assentoSelecionado){

        alert(
        'Selecione um assento'
        );

        return;

    }

    localStorage.setItem(
        'assentoSelecionado',
        assentoSelecionado
    );

    window.location.href =
    'pagamento.html';

}

function sair(){

    localStorage.removeItem(
        'usuario'
    );

    window.location.href =
    'index.html';

}

</script>
