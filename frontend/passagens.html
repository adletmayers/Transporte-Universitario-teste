<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="img/Gemini_Generated_Image_69ohf669ohf669oh_1_.ico">
<title>Passagens</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="navbar-container"></div>


<div class="container mt-4">

<div class="container mt-4">

    <div class="page-header mb-4">

        <h2>🎟️ Buscar Passagens</h2>

        <p class="text-muted">
            Encontre viagens disponíveis para sua universidade.
        </p>

    </div>

    <div class="card custom-card p-4 shadow-sm">

        <div class="row">

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Origem
                </label>

                <select
                    id="origem"
                    class="form-select">

                    <option value="">
                        Selecione a origem
                    </option>

                </select>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Destino
                </label>

                <select
                    id="destino"
                    class="form-select">

                    <option value="">
                        Selecione o destino
                    </option>

                </select>

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">
                    Data
                </label>

                <input
                    id="data"
                    type="date"
                    class="form-control">

            </div>

        </div>

        <small class="text-muted">

            Deixe a data em branco para visualizar todas as viagens disponíveis.

        </small>

        <button
            class="btn btn-primary w-100 mt-4"
            onclick="buscar()">

            🔍 Buscar Viagens

        </button>

    </div>

    <div
        id="resultado"
        class="mt-4">

    </div>

</div>


<script src="js/components.js"></script>
<script src="js/passagens.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
