<!DOCTYPE html>

<html>
<head>
<link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="img/Gemini_Generated_Image_69ohf669ohf669oh_1_.ico">
<title>Cadastro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-4">Cadastro</h2>

        <input id="nome" class="form-control mb-2" placeholder="Nome">

        <input id="email" class="form-control mb-2" placeholder="Email">

        <input id="senha" type="password" class="form-control mb-3" placeholder="Senha">

        <button class="btn btn-success mb-2" onclick="cadastrar()">
            Cadastrar
        </button>

        <a class="btn btn-secondary" href="#" onclick="sair()">
            Voltar
        </a>

    </div>

</div>

<script>


async function cadastrar(){

    const nome =
    document.getElementById('nome').value;

    const email =
    document.getElementById('email').value;

    const senha =
    document.getElementById('senha').value;

    const resposta =
    await fetch(
    'http://localhost:3000/usuarios',
    {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            nome,
            email,
            senha
        })
    });

    const dados =
    await resposta.json();

    if(dados.erro){

        alert(dados.erro);
        return;

    }

    alert('Cadastro realizado!');

  alert('Cadastro realizado com sucesso!');

  window.location.href =
  'index.html';

}
function sair(){

    localStorage.removeItem(
    'usuario'
    );

    window.location.href =
    'index.html';

}
</script>

<script src="js/tema.js"></script>
</body>
</html>
