<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<link rel="icon"
type="image/x-icon"
href="img/Gemini_Generated_Image_69ohf669ohf669oh_1_.ico">

<title>Compra Confirmada</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-success">
            ✅ Compra Confirmada
        </h2>

        <hr>

        <div id="dados">
            Carregando...
        </div>

        <div class="mt-3">

            <a
            href="historico.html"
            class="btn btn-success">

            Ver Histórico

            </a>

            <a
            href="dashboard.html"
            class="btn btn-primary">

            Voltar ao Início

            </a>

        </div>

    </div>

</div>

<script>

const compra =
JSON.parse(
localStorage.getItem(
'ultimaCompra'
)
);

if(!compra){

    document.getElementById(
    'dados'
    ).innerHTML =

    `
    <div class="alert alert-warning">

        Nenhuma compra encontrada.

    </div>
    `;

}else{

    document.getElementById(
    'dados'
    ).innerHTML =

    `

    <p>

        <strong>Origem:</strong>

        ${compra.viagem.origem}

    </p>

    <p>

        <strong>Destino:</strong>

        ${compra.viagem.destino}

    </p>

    <p>

        <strong>Assento:</strong>

        ${compra.assento}

    </p>

    <p>

        <strong>Pagamento:</strong>

        ${compra.forma}

    </p>

    <p>

        <strong>Data da Compra:</strong>

        ${
            compra.dataCompra
            ?
            new Date(
                compra.dataCompra
            ).toLocaleString('pt-BR')
            :
            '-'
        }

    </p>

    <p>

        <strong>Valor:</strong>

        R$ ${Number(
            compra.viagem.valor
        ).toFixed(2)}

    </p>

    `;

}

</script>

</body>

</html>
