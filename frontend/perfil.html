<script>

// USUÁRIO LOGADO

const usuario =
JSON.parse(
localStorage.getItem('usuario')
);
/*
==================================
APLICAR TEMA
==================================
*/


// PROTEÇÃO

if(!usuario){

    alert(
        'Faça login primeiro'
    );

    window.location.href =
    'index.html';

}
if(!usuario?.id){

    alert('Faça login novamente');

    localStorage.removeItem('usuario');

    window.location.href = 'index.html';

}
// MENU ADMIN

if(usuario.tipo === 'ADMIN'){

    document.getElementById(
        'menuAdmin'
    ).style.display = 'block';

}

// NOME NA NAVBAR

document.getElementById('usuario').innerHTML =

`Olá ${usuario.nome} 👋`;
/*
==================================
TIPO DE USUÁRIO
==================================
*/

const badge =
document.getElementById(
'badgeTipo'
);

if(usuario.tipo === 'ADMIN'){

    badge.className =
    'badge bg-danger fs-6';

    badge.innerHTML =
    'Administrador';

}else{

    badge.className =
    'badge bg-primary fs-6';

    badge.innerHTML =
    'Aluno';

}

/*
==================================
CARREGAR TEMA
==================================
*/

document.getElementById(
'temaSelect'
).value =
usuario.tema || 'dark';
// DADOS DO PERFIL

document.getElementById('perfil').innerHTML = `

<div class="row">

<div class="col-md-6">

<p>

<strong>🆔 ID:</strong>

${usuario.id}

</p>

<p>

<strong>👤 Nome:</strong>

${usuario.nome}

</p>

<p>

<strong>📧 Email:</strong>

${usuario.email}

</p>

</div>

<div class="col-md-6">

<p>

<strong>🪪 CPF:</strong>

${usuario.cpf || 'Não informado'}

</p>

<p>

<strong>🎂 Data de Nascimento:</strong>

${usuario.data_nascimento || 'Não informada'}

</p>

<p>

<strong>🔐 Tipo:</strong>

${usuario.tipo}

</p>

</div>

</div>

<hr>

<div class="text-center">

<h3 class="text-success">

💳 Saldo Disponível

</h3>

<h2 class="text-success">

R$ ${usuario.saldo || '0,00'}

</h2>

</div>

`;

function editarPerfil(){

    document.getElementById(
        'editNome'
    ).value = usuario.nome || '';

    document.getElementById(
        'editEmail'
    ).value = usuario.email || '';

    document.getElementById(
        'editCpf'
    ).value = usuario.cpf || '';

    document.getElementById(
        'editNascimento'
    ).value =
    usuario.data_nascimento || '';

    new bootstrap.Modal(

        document.getElementById(
            'modalPerfil'
        )

    ).show();

}
async function salvarPerfil(){

    const resposta =
    await fetch(

        `http://localhost:3000/usuarios/${usuario.id}`,

        {

            method:'PUT',

            headers:{
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                nome:
                document.getElementById(
                'editNome'
                ).value,

                email:
                document.getElementById(
                'editEmail'
                ).value,

                cpf:
                document.getElementById(
                'editCpf'
                ).value,

                data_nascimento:
                document.getElementById(
                'editNascimento'
                ).value

            })

        }

    );

    const dados =
    await resposta.json();

    alert(
        dados.mensagem
    );

    usuario.nome =
    document.getElementById(
    'editNome'
    ).value;

    usuario.email =
    document.getElementById(
    'editEmail'
    ).value;

    usuario.cpf =
    document.getElementById(
    'editCpf'
    ).value;

    usuario.data_nascimento =
    document.getElementById(
    'editNascimento'
    ).value;

    localStorage.setItem(
        'usuario',
        JSON.stringify(usuario)
    );

    location.reload();

}
function alterarSenha(){

    new bootstrap.Modal(

        document.getElementById(
            'modalSenha'
        )

    ).show();

}
async function salvarSenha(){

    const senhaAtual =
    document.getElementById(
    'senhaAtual'
    ).value;

    const novaSenha =
    document.getElementById(
    'novaSenha'
    ).value;

    const confirmarSenha =
    document.getElementById(
    'confirmarSenha'
    ).value;

    if(novaSenha !== confirmarSenha){

        alert(
            'As senhas não coincidem'
        );

        return;

    }

    const resposta =
    await fetch(

        'http://localhost:3000/usuarios/alterar-senha',

        {

            method:'PUT',

            headers:{
                'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

                id: usuario.id,

                senhaAtual,

                novaSenha

            })

        }

    );

    const dados =
    await resposta.json();

    alert(
        dados.mensagem || dados.erro
    );

}
async function alterarTema(){

    const novoTema =
    document.getElementById(
    'temaSelect'
    ).value;

    document.documentElement
    .setAttribute(
        'data-theme',
        novoTema
    );

    usuario.tema =
    novoTema;

    localStorage.setItem(
        'usuario',
        JSON.stringify(usuario)
    );

    localStorage.setItem(
        'tema',
        novoTema
    );

    try{

        await fetch(

            `http://localhost:3000/usuarios/${usuario.id}`,

            {

                method:'PUT',

                headers:{
                    'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({

                    nome:
                    usuario.nome,

                    email:
                    usuario.email,

                    cpf:
                    usuario.cpf,

                    data_nascimento:
                    usuario.data_nascimento,

                    tema:
                    novoTema

                })

            }

        );

    }catch(err){

        console.log(err);

    }

}
function sair(){

    localStorage.removeItem(
        'usuario'
    );

    window.location.href =
    'index.html';

}

</script>
