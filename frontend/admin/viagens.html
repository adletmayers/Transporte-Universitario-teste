<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="../img/Gemini_Generated_Image_69ohf669ohf669oh_1_.ico">
<link rel="stylesheet" href="../css/style.css"> 
<title>Admin - Viagens</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
<div id="navbar-container"></div>

<div class="container mt-4">

<h2 id="tituloPagina">
Cadastrar Viagem
</h2>

<label class="form-label">Origem</label>
<input
id="origem"
class="form-control mb-3"
placeholder="Origem">

<label class="form-label">Destino</label>
<input
id="destino"
class="form-control mb-3"
placeholder="Destino">

<label class="form-label">Data da viagem</label>
<input
id="data"
type="date"
class="form-control mb-3">

<label class="form-label">Horário de saída</label>
<input
id="saida"
type="time"
class="form-control mb-3">

<label class="form-label">Horário de chegada</label>
<input
id="chegada"
type="time"
class="form-control mb-3">

<label class="form-label">Valor da passagem (R$)</label>
<input
id="valor"
type="number"
class="form-control mb-3">

<label class="form-label">Quantidade de vagas</label>
<input
id="vagas"
type="number"
class="form-control mb-3">

<button
id="btnSalvar"
class="btn btn-success"
onclick="salvar()">

Cadastrar

</button>

</div>
<hr>
<div class="container mt-4">
<h3>
Viagens Cadastradas
</h3>

<div id="listaViagens"></div>


</div>
<script src="../js/tema.js"></script>
<script src="../js/components.js"></script>
<script src="../js/viagens.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
